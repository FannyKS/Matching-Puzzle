<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Photo Detective — the real Photo Library</title>
<style>
  body { font: 13px/1.6 ui-monospace, Menlo, monospace; margin: 20px; background: #111; color: #ddd; }
  .ok { color: #6f6; } .bad { color: #f66; font-weight: 700; }
  pre { margin: 0; }
</style>
</head>
<body>
<pre id="out"></pre>
<!-- Generated by list-photos.py. No directory listing over HTTP, so the
     filenames have to come from somewhere. Must load before the suite. -->
<script src="real-photos.names.js"></script>
<script>
/* ============================================================
   real-photos.html — imports the actual Photo Library folder in
   this project and checks what the picker would offer.

   The picker cannot be driven from a test, so the same File objects
   a directory selection would produce are built here instead. The
   photos are the user's own, so nothing is asserted about which
   ones exist -- only that every one of them comes through playable.
   ============================================================ */
(function () {
  'use strict';
  var OUT = document.getElementById('out');
  var failures = 0;

  function paint(text, bad, plain) {
    var line = document.createElement('div');
    line.className = bad ? 'bad' : 'ok';
    line.textContent = text;
    OUT.appendChild(line);
    if (!plain) post(text);
  }

  /** True when a canvas holds nothing but transparent black: never painted. */
  function blank(canvas) {
    if (!canvas.width || !canvas.height) return true;
    var px = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    for (var i = 3; i < px.length; i += 4) {
      if (px[i] !== 0) return false;
    }
    return true;
  }
  function ok(cond, label, detail) {
    if (!cond) failures++;
    paint((cond ? 'PASS ' : 'FAIL ') + label + (detail ? '  [' + detail + ']' : ''), !cond);
  }
  function post(text) {
    var req = new XMLHttpRequest();
    req.open('POST', '/report', true);
    req.send(text);
  }

  function report(text) {
    var req = new XMLHttpRequest();
    req.open('POST', '/report-final', true);
    req.send(text + '\nfailures ' + failures);
  }

  function loadScripts() {
    var list = ['stage.js', 'library.js', 'puzzle.js', 'game.js'];
    return list.reduce(function (chain, name) {
      return chain.then(function () {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = '../js/' + name;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('could not load ' + name)); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve());
  }

  var NAMES = window.PHOTO_NAMES || [];

  // One failure stops the run: a photo that will not fetch means the page is
  // pointed somewhere else entirely, and every later check would be noise.
  function fetchOne(name) {
    return fetch('../Photo Library/' + encodeURIComponent(name))
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + name);
        return r.blob();
      })
      .then(function (blob) {
        var file = new File([blob], name, { type: blob.type });
        Object.defineProperty(file, 'webkitRelativePath', { value: name });
        return { file: file, path: name, name: name };
      });
  }

  loadScripts().then(function () {
    var lib = window.PhotoLibrary;
    ok(!!lib, 'the library booted');
    paint('found ' + NAMES.length + ' photos in the folder');
    return Promise.all(NAMES.map(fetchOne));
  }).then(function (items) {
    return window.PhotoLibrary.importFiles(items, null);
  }).then(function (r) {
    ok(r.added + r.updated + r.sharpened + r.replaced + r.skipped === r.total,
       'every photo in the folder was accounted for', JSON.stringify(r));
    var snap = window.PhotoLibrary.state();
    ok(snap.present === snap.total, 'all of them are playable',
       snap.present + ' of ' + snap.total);
    ok(snap.missing === 0, 'and none is missing', String(snap.missing));

    var entries = window.PhotoLibrary.present();
    entries.forEach(function (e) {
      paint('  · ' + e.title + '   [' + e.category + ']');
    });

    // Every one has to actually decode into a dealable puzzle, which is the
    // only thing that proves a photo is usable rather than merely listed.
    return entries.reduce(function (chain, e) {
      return chain.then(function () {
        return e.load().then(function (photo) {
          var pz = new window.Puzzle(photo);
          var cv = pz.canvasFor(pz.get(0), 40, 40, 'contain');
          ok(cv.width > 0 && cv.height > 0, '"' + e.title + '" cuts into cards',
             cv.width + 'x' + cv.height);
          ok(!blank(cv), '"' + e.title + '" has pixels painted on its cards');

          // Reported, not asserted. A card is one sixth of the photo, and a card
          // is about 180 CSS px -- so 360 device px on a 2x screen. A photo with
          // fewer pixels per card than that cannot be sharp however it is
          // processed, which is worth seeing in a list rather than hunting for.
          var per = Math.floor(Math.max(photo.pixelWidth, photo.pixelHeight) / pz.cols);
          paint('    ' + per + ' px per card' + (per < 360 ? '   (soft: under 360)' : ''),
                false, true);
        });
      });
    }, Promise.resolve());
  }).then(function () {
    report('done');
  }).catch(function (err) {
    failures++;
    paint('threw: ' + (err && err.message ? err.message : err), true);
    report('threw: ' + err);
  });
})();
</script>
</body>
</html>
